name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test application
        run: npm test
      - name: Test Eon 2 services and shared layouts
        run: npm run test:eon2
      - name: Build Electron application
        run: npm run build
      - name: Browser lifecycle smoke test
        run: npm run test:browser
      - name: Eon 2 Deck desktop smoke
        shell: pwsh
        run: |
          $process = Start-Process node_modules/electron/dist/electron.exe -ArgumentList 'electron/eon2/deck-mirror-smoke.cjs' -Wait -PassThru -WindowStyle Hidden
          exit $process.ExitCode
      - name: Eon 2 update center smoke
        shell: pwsh
        run: |
          $process = Start-Process node_modules/electron/dist/electron.exe -ArgumentList 'electron/eon2/updates/updates-smoke.cjs' -Wait -PassThru -WindowStyle Hidden
          exit $process.ExitCode
